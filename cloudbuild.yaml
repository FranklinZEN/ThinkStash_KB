# Top-level availableSecrets defines how secrets map to ENV VARS for steps.
availableSecrets:
  secretManager:
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-user/versions/latest
      env: 'DB_USER' # This ENV VAR will hold the user secret
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-password/versions/latest
      env: 'DB_PASSWORD' # This ENV VAR will hold the password secret
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-name/versions/latest
      env: 'DB_NAME' # This ENV VAR will hold the database name secret (value: thinkstash)

steps:
# Step 1: Install Dependencies
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['install']
  id: 'Install Dependencies'

# Step 2: Lint
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'lint']
  id: 'Lint'
  waitFor: ['Install Dependencies']

# Step 3: Test
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'test']
  id: 'Test'
  waitFor: ['Lint']

# Step 4: Build Prisma Client
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'prisma:generate']
  id: 'Build Prisma Client'
  waitFor: ['Test']

# Step 5: Build Next.js app
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'build']
  id: 'Build Next.js app'
  waitFor: ['Build Prisma Client']

# Step 6: Build Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '.'
  ]
  id: 'Build Docker image'
  waitFor: ['Build Next.js app']

# Step 7: Push Docker image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA']
  id: 'Push Docker image'
  waitFor: ['Build Docker image']

# Step 8: Download Proxy, Start Proxy, Run Migrations, Kill Proxy
- name: '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA' # Your app image
  id: 'Run Migrations with Proxy'
  waitFor: ['Push Docker image'] # Depends on Step 7
  secretEnv:
    - 'DB_USER'
    - 'DB_PASSWORD'
    - 'DB_NAME'
  entrypoint: 'sh'
  args:
    - '-c'
    - |
      set -e # Exit immediately if a command exits with a non-zero status.

      echo "Step 8: Preparing for database migration..."

      # Install netcat if not present (Alpine Linux for node:20-slim based images)
      # if ! nc -h > /dev/null 2>&1; then
      #   echo "netcat (nc) not found, attempting to install netcat-openbsd..."
      #   apk update && apk add --no-cache netcat-openbsd
      # fi
      
      PROXY_VERSION="v2.10.0" 
      PROXY_ARCH="linux.amd64"
      PROXY_DOWNLOAD_URL="https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/$${PROXY_VERSION}/cloud-sql-proxy.$${PROXY_ARCH}"
      PROXY_PATH="/tmp/cloud-sql-proxy"

      echo "Downloading Cloud SQL Proxy version $${PROXY_VERSION}..."
      wget -q "$${PROXY_DOWNLOAD_URL}" -O "$${PROXY_PATH}"
      chmod +x "$${PROXY_PATH}"

      echo "Starting Cloud SQL Proxy in background for instance: ${_DB_INSTANCE_CONNECTION_NAME}..."
      "$${PROXY_PATH}" \
        "${_DB_INSTANCE_CONNECTION_NAME}" \
        --address=0.0.0.0 --port=5432 --structured-logs &
      PROXY_PID=$!
      echo "Proxy started in background with PID $${PROXY_PID}."
      
      echo "Sleeping 15 seconds for proxy to fully initialize..." # Reduced sleep
      sleep 15

      # echo "Attempting to check connectivity to localhost:5432 with nc..."
      # nc -v -w 5 localhost 5432 < /dev/null && echo "nc: Connection to localhost:5432 succeeded." || (echo "nc: Connection to localhost:5432 FAILED. Exiting." && exit 1)

      echo "Setting DATABASE_URL and running Prisma migrations..."
      export DATABASE_URL="postgresql://$${DB_USER}:$${DB_PASSWORD}@localhost:5432/$${DB_NAME}?sslmode=disable" # Kept sslmode=disable
      echo "DATABASE_URL set to: [$${DATABASE_URL}]"
      
      npx prisma migrate deploy
      
      echo "Prisma migrations finished."
      echo "Attempting to gracefully kill Cloud SQL Proxy (PID $${PROXY_PID})..."
      kill $${PROXY_PID} || echo "Proxy (PID $${PROXY_PID}) already exited or failed to kill."
      # Wait a moment for the process to terminate
      sleep 2 
      if kill -0 $${PROXY_PID} > /dev/null 2>&1; then
        echo "Proxy (PID $${PROXY_PID}) did not terminate gracefully after kill, sending SIGKILL."
        kill -9 $${PROXY_PID} || echo "Failed to send SIGKILL or proxy already exited."
      else
        echo "Proxy (PID $${PROXY_PID}) terminated or was already stopped."
      fi
      
      echo "Proxy and migration step complete."

# Step 9: Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Deploy to Cloud Run'
  waitFor: ['Run Migrations with Proxy'] # Depends on the new Step 8
  entrypoint: gcloud
  args: [
    'run',
    'deploy',
    '${_CLOUD_RUN_SERVICE_NAME}',
    '--image=${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '--region=${_GCP_REGION}',
    '--platform=managed',
    '--allow-unauthenticated',
    '--service-account=${_CLOUD_RUN_SA_EMAIL}'
  ]

options:
  logging: CLOUD_LOGGING_ONLY
# rerun to test if this works

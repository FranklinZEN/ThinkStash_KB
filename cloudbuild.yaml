# Top-level availableSecrets block has been removed.
# Secrets are now defined directly in the step that needs them (Step 8).

steps:
# Step 1: Install Dependencies
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['install']
  id: 'Install Dependencies'

# Step 2: Lint
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'lint']
  id: 'Lint'
  waitFor: ['Install Dependencies']

# Step 3: Test
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'test']
  id: 'Test'
  waitFor: ['Lint']

# Step 4: Build Prisma Client
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'prisma:generate']
  id: 'Build Prisma Client'
  waitFor: ['Test']

# Step 5: Build Next.js app
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'build']
  id: 'Build Next.js app'
  waitFor: ['Build Prisma Client']

# Step 6: Build Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '.'
  ]
  id: 'Build Docker image'
  waitFor: ['Build Next.js app']

# Step 7: Push Docker image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA']
  id: 'Push Docker image'
  waitFor: ['Build Docker image']

# Step 8: Apply Database Migrations (More Debugging)
- name: 'gcr.io/google-appengine/exec-wrapper'
  id: 'Apply Database Migrations - More Debugging'
  waitFor: ['Push Docker image']
  # Secrets are now defined directly for exec-wrapper, mapping environment variables
  # inside the container to their Secret Manager paths.
  secretEnv:
    - 'DB_USER=projects/${_PROJECT_ID}/secrets/kc-db-user/versions/latest'
    - 'DB_PASSWORD=projects/${_PROJECT_ID}/secrets/kc-db-password/versions/latest'
    # If you were using kc-db-name dynamically, you would add:
    # - 'DB_NAME=projects/${_PROJECT_ID}/secrets/kc-db-name/versions/latest'
  args:
    - '-i'
    - '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA'
    - '-s'
    - '${_DB_INSTANCE_CONNECTION_NAME}'
    - '--'
    - 'sh'
    - '-c'
    - |-
        echo "DEBUG: Cloud Build Step Started. Setting environment variables..."
        echo "DEBUG: Value of _PROJECT_ID from substitution: [${_PROJECT_ID}]"
        # These echos will now use the new environment variable names (DB_USER, DB_PASSWORD)
        # that are directly populated by exec-wrapper's secretEnv.
        echo "DEBUG: Value of DB_USER from env before export: [$${DB_USER}]"
        echo "DEBUG: Value of DB_PASSWORD from env before export: [$${DB_PASSWORD}]"

        # Using hardcoded 'thinkstash' for the database name as per current testing phase.
        # If you use DB_NAME dynamically later (from secretEnv), change /thinkstash to /$${DB_NAME}
        export DATABASE_URL="postgresql://$${DB_USER}:$${DB_PASSWORD}@localhost:5432/thinkstash"
        export DEBUG="prisma*"

        echo "DEBUG: DATABASE_URL and DEBUG potentially set. Waiting 5 seconds for proxy..."
        /bin/sleep 5

        echo "DEBUG: Attempting to print DATABASE_URL and DEBUG env var from Node.js..."
        node -e "console.log('DATABASE_URL_AS_SEEN_BY_NODE: ' + process.env.DATABASE_URL);"
        node -e "console.log('DEBUG_ENV_VAR_AS_SEEN_BY_NODE: ' + process.env.DEBUG);"
        node -e "console.log('DB_USER_AS_SEEN_BY_NODE: ' + process.env.DB_USER);"
        node -e "console.log('DB_PASSWORD_AS_SEEN_BY_NODE: ' + process.env.DB_PASSWORD);"


        echo "DEBUG: Node.js print attempt finished. Waiting another 10 seconds..."
        /bin/sleep 10

        echo "DEBUG: Running npx prisma migrate deploy..."
        npx prisma migrate deploy

# Step 9: Deploy to Cloud Run (REMOVED)
# - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
#   id: 'Deploy to Cloud Run'
#   waitFor: ['Apply Database Migrations - More Debugging']
#   entrypoint: gcloud
#   args: [
#     'run',
#     'deploy',
#     '${_CLOUD_RUN_SERVICE_NAME}',
#     '--image=${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
#     '--region=${_GCP_REGION}',
#     '--platform=managed',
#     '--allow-unauthenticated',
#     '--service-account=${_CLOUD_RUN_SA_EMAIL}'
#   ]

# Ensure this options block is at the root level and uses standard spaces for indentation.
options:
  logging: CLOUD_LOGGING_ONLY

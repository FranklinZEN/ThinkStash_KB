steps:
# Step 1: Install Dependencies
- name: 'gcr.io/cloud-builders/npm' # Using the dedicated npm builder
  entrypoint: 'npm'
  args: ['install']
  id: 'Install Dependencies'

# Step 2: Lint
- name: 'gcr.io/cloud-builders/npm' # Uses the same environment
  entrypoint: 'npm'
  args: ['run', 'lint']
  id: 'Lint'
  waitFor: ['Install Dependencies'] # Optional but good practice

options:
  logging: CLOUD_LOGGING_ONLY
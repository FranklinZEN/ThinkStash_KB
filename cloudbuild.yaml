# Top-level availableSecrets defines how secrets map to ENV VARS for steps
availableSecrets:
  secretManager:
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-user/versions/latest
      env: 'kc-db-user'
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-password/versions/latest
      env: 'kc-db-password'
    # If you re-introduce kc-db-name, uncomment its definition here and in Step 8's script
    # - versionName: projects/${_PROJECT_ID}/secrets/kc-db-name/versions/latest
    #   env: 'kc-db-name'

steps:
# Step 1: Install Dependencies
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['install']
  id: 'Install Dependencies'

# Step 2: Lint
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'lint']
  id: 'Lint'
  waitFor: ['Install Dependencies']

# Step 3: Test
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'test']
  id: 'Test'
  waitFor: ['Lint']

# Step 4: Build Prisma Client
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'prisma:generate']
  id: 'Build Prisma Client'
  waitFor: ['Test']

# Step 5: Build Next.js app
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'build']
  id: 'Build Next.js app'
  waitFor: ['Build Prisma Client']

# Step 6: Build Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '.'
  ]
  id: 'Build Docker image'
  waitFor: ['Build Next.js app']

# Step 7: Push Docker image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA']
  id: 'Push Docker image'
  waitFor: ['Build Docker image']

# Step 8: Apply Database Migrations (More Debugging)
- name: 'gcr.io/google-appengine/exec-wrapper'
  id: 'Apply Database Migrations - More Debugging'
  waitFor: ['Push Docker image']
  # We removed secretEnv here.
  # The environment variables kc-db-user and kc-db-password (populated by top-level availableSecrets)
  # will be passed into the container using the -e flags below.
  args:
    - '-i'
    - '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA'
    - '-s'
    - '${_DB_INSTANCE_CONNECTION_NAME}'
    # Pass environment variables (populated by availableSecrets) into the exec-wrapper container
    - '-e' # Flag to indicate passing an environment variable
    - 'kc-db-user' # Name of the environment variable to pass from the build step's env
    - '-e' # Flag to indicate passing an environment variable
    - 'kc-db-password' # Name of the environment variable to pass from the build step's env
    # If you were using kc-db-name dynamically, you would also add:
    # - '-e'
    # - 'kc-db-name'
    - '--'
    - 'sh'
    - '-c'
    - |-
        echo "DEBUG: Cloud Build Step Started. Setting environment variables..."
        echo "DEBUG: Value of _PROJECT_ID from substitution: [${_PROJECT_ID}]"
        # These echos should now reflect the actual secret values if availableSecrets and -e flags work
        echo "DEBUG: Value of kc-db-user from env before export: [$${kc-db-user}]"
        echo "DEBUG: Value of kc-db-password from env before export: [$${kc-db-password}]"

        # Using hardcoded 'thinkstash' for the database name as per current testing phase.
        # If you use kc-db-name dynamically later, change /thinkstash to /$${kc-db-name}
        export DATABASE_URL="postgresql://$${kc-db-user}:$${kc-db-password}@localhost:5432/thinkstash"
        export DEBUG="prisma*"

        echo "DEBUG: DATABASE_URL and DEBUG potentially set. Waiting 5 seconds for proxy..."
        /bin/sleep 5

        echo "DEBUG: Attempting to print DATABASE_URL and DEBUG env var from Node.js..."
        node -e "console.log('DATABASE_URL_AS_SEEN_BY_NODE: ' + process.env.DATABASE_URL);"
        node -e "console.log('DEBUG_ENV_VAR_AS_SEEN_BY_NODE: ' + process.env.DEBUG);"

        echo "DEBUG: Node.js print attempt finished. Waiting another 10 seconds..."
        /bin/sleep 10

        echo "DEBUG: Running npx prisma migrate deploy..."
        npx prisma migrate deploy

# Step 9: Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Deploy to Cloud Run'
  waitFor: ['Apply Database Migrations - More Debugging']
  entrypoint: gcloud
  args: [
    'run',
    'deploy',
    '${_CLOUD_RUN_SERVICE_NAME}',
    '--image=${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '--region=${_GCP_REGION}',
    '--platform=managed',
    '--allow-unauthenticated',
    '--service-account=${_CLOUD_RUN_SA_EMAIL}'
  ]

options:
  logging: CLOUD_LOGGING_ONLY

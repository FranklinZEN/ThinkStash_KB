# Top-level availableSecrets defines how secrets map to ENV VARS for steps.
availableSecrets:
  secretManager:
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-user/versions/latest
      env: 'DB_USER' # This ENV VAR will hold the user secret
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-password/versions/latest
      env: 'DB_PASSWORD' # This ENV VAR will hold the password secret
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-name/versions/latest
      env: 'DB_NAME' # This ENV VAR will hold the database name secret (value: thinkstash)

steps:
# Step 1: Install Dependencies
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['install']
  id: 'Install Dependencies'

# Step 2: Lint
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'lint']
  id: 'Lint'
  waitFor: ['Install Dependencies']

# Step 3: Test
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'test']
  id: 'Test'
  waitFor: ['Lint']

# Step 4: Build Prisma Client
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'prisma:generate']
  id: 'Build Prisma Client'
  waitFor: ['Test']

# Step 5: Build Next.js app
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'build']
  id: 'Build Next.js app'
  waitFor: ['Build Prisma Client']

# Step 6: Build Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '.'
  ]
  id: 'Build Docker image'
  waitFor: ['Build Next.js app']

# Step 7: Push Docker image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA']
  id: 'Push Docker image'
  waitFor: ['Build Docker image']

# Step 8: Apply Database Migrations
- name: 'gcr.io/google-appengine/exec-wrapper'
  id: 'Apply Database Migrations'
  waitFor: ['Push Docker image']
  secretEnv:
    - 'DB_USER'
    - 'DB_PASSWORD'
    - 'DB_NAME'
  env:
    - 'CLOUD_SQL_PROXY_VERBOSE=true' # Keep trying for verbose logs
  args:
    - '-i'
    - '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA'
    - '-s'
    - '${_DB_INSTANCE_CONNECTION_NAME}'
    - '-e' 
    - 'DB_USER'
    - '-e'
    - 'DB_PASSWORD'
    - '-e'
    - 'DB_NAME'
    - '--'
    - 'sh'
    - '-c'
    - |
        echo "DATABASE_URL will be: postgresql://$${DB_USER}:$${DB_PASSWORD}@localhost:5432/$${DB_NAME}?schema=public"
        echo "Sleeping for 15 seconds to allow proxy to initialize..."
        /bin/sleep 15

        echo "Attempting to check connectivity to localhost:5432 with nc..."
        # nc -zv localhost 5432  # -z for zero-I/O, -v for verbose. Exit 0 if port is open.
        # Alpine's nc (from BusyBox) might not support -z without -w or have different syntax.
        # A simpler check: try to connect and immediately close.
        # (echo "" > /dev/tcp/localhost/5432) && echo "nc: Connection to localhost:5432 succeeded." || echo "nc: Connection to localhost:5432 FAILED."
        # The /dev/tcp test is a bash-ism, sh (dash) in node:slim might not have it.

        # Fallback nc command (adjust timeout with -w if needed, e.g. -w 3 for 3 seconds)
        echo "Trying nc localhost 5432..."
        nc -v -w 5 localhost 5432 < /dev/null && echo "nc check via netcat passed" || echo "nc check via netcat FAILED or timed out"
        
        echo "Proceeding with Prisma migration..."
        export DATABASE_URL="postgresql://$${DB_USER}:$${DB_PASSWORD}@localhost:5432/$${DB_NAME}?schema=public"
        npx prisma migrate deploy

# Step 9: Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Deploy to Cloud Run'
  waitFor: ['Apply Database Migrations']
  entrypoint: gcloud
  args: [
    'run',
    'deploy',
    '${_CLOUD_RUN_SERVICE_NAME}',
    '--image=${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '--region=${_GCP_REGION}',
    '--platform=managed',
    '--allow-unauthenticated',
    '--service-account=${_CLOUD_RUN_SA_EMAIL}'
  ]

options:
  logging: CLOUD_LOGGING_ONLY

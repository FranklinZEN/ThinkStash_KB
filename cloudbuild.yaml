# Top-level availableSecrets defines how secrets map to ENV VARS for steps.
availableSecrets:
  secretManager:
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-user/versions/latest
      env: 'DB_USER' # This ENV VAR will hold the user secret
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-password/versions/latest
      env: 'DB_PASSWORD' # This ENV VAR will hold the password secret
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-name/versions/latest
      env: 'DB_NAME' # This ENV VAR will hold the database name secret (value: thinkstash)

steps:
# Step 1: Install Dependencies
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['install']
  id: 'Install Dependencies'

# Step 2: Lint
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'lint']
  id: 'Lint'
  waitFor: ['Install Dependencies']

# Step 3: Test
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'test']
  id: 'Test'
  waitFor: ['Lint']

# Step 4: Build Prisma Client
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'prisma:generate']
  id: 'Build Prisma Client'
  waitFor: ['Test']

# Step 5: Build Next.js app
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'build']
  id: 'Build Next.js app'
  waitFor: ['Build Prisma Client']

# Step 6: Build Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '.'
  ]
  id: 'Build Docker image'
  waitFor: ['Build Next.js app']

# Step 7: Push Docker image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA']
  id: 'Push Docker image'
  waitFor: ['Build Docker image']

# Step 7.5: Diagnose Secrets Availability
# This step will try to print the environment variables populated by availableSecrets.
- name: 'ubuntu' # Using a general-purpose image
  id: 'Diagnose Secrets Availability'
  waitFor: ['Push Docker image']
  entrypoint: 'sh'
  args:
    - '-c'
    - |-
        echo "--- DIAGNOSTIC STEP: Checking Environment Variables ---"
        # Escaped $ with $$ so Cloud Build passes ${VAR} to the shell for environment variable expansion
        echo "Value of DB_USER: [$${DB_USER}]"
        echo "Value of DB_PASSWORD: [$${DB_PASSWORD}]"
        echo "Value of DB_NAME: [$${DB_NAME}]"
        echo "--- END DIAGNOSTIC STEP ---"
  # The DB_USER, DB_PASSWORD, DB_NAME env vars should be available here
  # if the top-level availableSecrets is working correctly.

# Step 8: Apply Database Migrations (Using Dynamic DB Name)
- name: 'gcr.io/google-appengine/exec-wrapper'
  id: 'Apply Database Migrations - Dynamic DB Name'
  waitFor: ['Diagnose Secrets Availability'] # Wait for the diagnostic step
  secretEnv:
    - 'DB_USER'
    - 'DB_PASSWORD'
    - 'DB_NAME'
  args:
    - '-i'
    - '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA'
    - '-s'
    - '${_DB_INSTANCE_CONNECTION_NAME}'
    - '--'
    - 'sh'
    - '-c'
    - |-
        echo "DEBUG (Step 8): Cloud Build Step Started. Setting environment variables..."
        echo "DEBUG (Step 8): Value of _PROJECT_ID from substitution: [${_PROJECT_ID}]"
        echo "DEBUG (Step 8): Value of DB_USER from env before export: [$${DB_USER}]"
        echo "DEBUG (Step 8): Value of DB_PASSWORD from env before export: [$${DB_PASSWORD}]"
        echo "DEBUG (Step 8): Value of DB_NAME from env before export: [$${DB_NAME}]"

        export DATABASE_URL="postgresql://$${DB_USER}:$${DB_PASSWORD}@localhost:5432/$${DB_NAME}?schema=public"
        export DEBUG="prisma*"

        echo "DEBUG (Step 8): DATABASE_URL and DEBUG potentially set. Waiting 5 seconds for proxy..."
        /bin/sleep 5

        echo "DEBUG (Step 8): Attempting to print DATABASE_URL and DEBUG env var from Node.js..."
        node -e "console.log('DATABASE_URL_AS_SEEN_BY_NODE (Step 8): ' + process.env.DATABASE_URL);"
        node -e "console.log('DEBUG_ENV_VAR_AS_SEEN_BY_NODE (Step 8): ' + process.env.DEBUG);"
        node -e "console.log('DB_USER_AS_SEEN_BY_NODE (Step 8): ' + process.env.DB_USER);"
        node -e "console.log('DB_PASSWORD_AS_SEEN_BY_NODE (Step 8): ' + process.env.DB_PASSWORD);"
        node -e "console.log('DB_NAME_AS_SEEN_BY_NODE (Step 8): ' + process.env.DB_NAME);"

        echo "DEBUG (Step 8): Node.js print attempt finished. Waiting another 10 seconds..."
        /bin/sleep 10

        echo "DEBUG (Step 8): Running npx prisma migrate deploy..."
        npx prisma migrate deploy

# Step 9: Deploy to Cloud Run (Re-included)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Deploy to Cloud Run'
  waitFor: ['Apply Database Migrations - Dynamic DB Name']
  entrypoint: gcloud
  args: [
    'run',
    'deploy',
    '${_CLOUD_RUN_SERVICE_NAME}',
    '--image=${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '--region=${_GCP_REGION}',
    '--platform=managed',
    '--allow-unauthenticated',
    '--service-account=${_CLOUD_RUN_SA_EMAIL}'
  ]

# Ensure this options block is at the root level and uses standard spaces for indentation.
options:
  logging: CLOUD_LOGGING_ONLY

# This is a complete refactor of the cloudbuild.yaml for the new architecture.
# It separates build steps for the webapp and the new AI worker service.

substitutions:
  _GCP_REGION: us-central1
  # Add other substitutions like _PROJECT_ID, _ARTIFACT_REGISTRY_REPO etc. as needed from your setup.
  # Assuming _CLOUD_RUN_SERVICE_NAME, _CLOUD_RUN_SA_EMAIL are set in the trigger.

steps:
# ==============================================================================
# WEBAPP - Build, Test, and Deploy the Next.js Frontend
# ==============================================================================

# 1. Install Webapp Dependencies
- name: 'node:20'
  id: 'webapp-install'
  entrypoint: 'npm'
  args: ['install']

# 2. Build Next.js App (Prisma Generate is now part of this script)
- name: 'node:20'
  id: 'webapp-build'
  waitFor: ['webapp-install']
  entrypoint: 'npm'
  args: ['run', 'build']

# 3. Build Webapp Docker Image
- name: 'gcr.io/cloud-builders/docker'
  id: 'webapp-docker-build'
  waitFor: ['webapp-build']
  args: [
    'build',
    '--no-cache',
    '-t',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-webapp:$COMMIT_SHA',
    '-f', 'webapp.Dockerfile',
    '.'
  ]

# 4. Push Webapp Docker Image
- name: 'gcr.io/cloud-builders/docker'
  id: 'webapp-docker-push'
  waitFor: ['webapp-docker-build']
  args: ['push', '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-webapp:$COMMIT_SHA']

# 5. Run Webapp Migrations with Cloud SQL Proxy
- name: '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-webapp:$COMMIT_SHA'
  id: 'webapp-migrations'
  waitFor: ['webapp-docker-push']
  secretEnv:
    - 'DB_USER'
    - 'DB_PASSWORD'
    - 'DB_NAME'
  entrypoint: 'sh'
  args:
    - '-c'
    - |
      set -e
      echo "Starting migrations with Cloud SQL Proxy..."
      wget https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.10.0/cloud-sql-proxy.linux.amd64 -O /tmp/cloud-sql-proxy
      chmod +x /tmp/cloud-sql-proxy
      # Start proxy in the background. HARDCODED to prevent newline corruption.
      /tmp/cloud-sql-proxy "thinkstash-knowledge-base:us-central1:knowledge-base-ts-db-instance" &
      echo "Waiting for proxy to initialize (10s)..."
      sleep 10
      # The DATABASE_URL for the migration must point to the local proxy
      export DATABASE_URL="postgresql://$${DB_USER}:$${DB_PASSWORD}@127.0.0.1:5432/$${DB_NAME}?sslmode=disable"
      echo "DATABASE_URL set for migration. Running migrations..."
      npx prisma migrate deploy
      echo "Migrations complete."
      # Cloud Build automatically terminates child processes (the proxy)

# 6. Deploy Webapp to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'webapp-deploy'
  waitFor: ['webapp-migrations']
  entrypoint: gcloud
  args: [
    'run', 'deploy', '${_CLOUD_RUN_SERVICE_NAME}', # e.g., thinkstash-webapp
    '--image=${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-webapp:$COMMIT_SHA',
    '--region=${_GCP_REGION}',
    '--platform=managed',
    '--allow-unauthenticated',
    '--service-account=${_CLOUD_RUN_SA_EMAIL}',
    # HARDCODED to prevent newline corruption from trigger variables
    '--add-cloudsql-instances=thinkstash-knowledge-base:us-central1:knowledge-base-ts-db-instance',
    '--set-secrets=DATABASE_URL=thinkstash-db-url:latest,NEXTAUTH_SECRET=nextauth-secret:latest'
  ]

# ==============================================================================
# AISERVICE - Build and Deploy the Python API and Worker
# ==============================================================================

# 7. Build Common AI Service Docker Image
- name: 'gcr.io/cloud-builders/docker'
  id: 'aiservice-docker-build'
  dir: 'aiservice'
  args: [
    'build',
    '--no-cache',
    '-t',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-aiservice:$COMMIT_SHA',
    '-f', 'worker.Dockerfile',
    '.'
  ]

# 8. Push Common AI Service Docker Image
- name: 'gcr.io/cloud-builders/docker'
  id: 'aiservice-docker-push'
  waitFor: ['aiservice-docker-build']
  args: ['push', '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-aiservice:$COMMIT_SHA']

# 9. Deploy AI API Service to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'aiservice-api-deploy'
  waitFor: ['aiservice-docker-push']
  entrypoint: 'gcloud'
  args:
    - 'run'
    - 'deploy'
    - 'thinkstash-aiservice'
    - '--image'
    - '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-aiservice:$COMMIT_SHA'
    - '--region'
    - '${_GCP_REGION}'
    - '--platform=managed'
    - '--no-allow-unauthenticated'
    - '--service-account=${_CLOUD_RUN_SA_EMAIL}'
    - '--add-cloudsql-instances=thinkstash-knowledge-base:us-central1:knowledge-base-ts-db-instance'
    - '--port=8080'
    - '--cpu=1'
    - '--memory=512Mi'
    - '--set-secrets=DATABASE_URL=thinkstash-db-url:latest,GEMINI_API_KEY=gemini-api-key:latest'
    - '--command=uvicorn'
    - '--args=main:app,--host=0.0.0.0,--port=8080'

# 10. Deploy AI Worker to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'worker-deploy'
  waitFor: ['aiservice-docker-push']
  entrypoint: 'gcloud'
  args:
    - 'run'
    - 'deploy'
    - 'thinkstash-worker'
    - '--image'
    - '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-aiservice:$COMMIT_SHA'
    - '--region'
    - '${_GCP_REGION}'
    - '--platform=managed'
    - '--no-allow-unauthenticated'
    - '--service-account=${_CLOUD_RUN_SA_EMAIL}'
    # HARDCODED to prevent newline corruption from trigger variables
    - '--add-cloudsql-instances=thinkstash-knowledge-base:us-central1:knowledge-base-ts-db-instance'
    - '--port=8080'
    - '--cpu=1'
    - '--memory=512Mi'
    - '--min-instances=1'
    - '--max-instances=3'
    - '--set-secrets=DATABASE_URL=thinkstash-db-url:latest,GEMINI_API_KEY=gemini-api-key:latest,WORKER_KEY=thinkstash-worker-key:latest'
    - '--command=python'
    - '--args=-u,worker.py'
    - '--no-cpu-throttling'
    - '--no-traffic'

# Define available secrets from Secret Manager
availableSecrets:
  secretManager:
  - versionName: projects/${_PROJECT_ID}/secrets/kc-db-user/versions/latest
    env: 'DB_USER'
  - versionName: projects/${_PROJECT_ID}/secrets/kc-db-password/versions/latest
    env: 'DB_PASSWORD'
  - versionName: projects/${_PROJECT_ID}/secrets/kc-db-name/versions/latest
    env: 'DB_NAME'

options:
  logging: CLOUD_LOGGING_ONLY
# Top-level availableSecrets defines how secrets map to ENV VARS for steps.
availableSecrets:
  secretManager:
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-user/versions/latest
      env: 'DB_USER' # This ENV VAR will hold the user secret
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-password/versions/latest
      env: 'DB_PASSWORD' # This ENV VAR will hold the password secret
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-name/versions/latest
      env: 'DB_NAME' # This ENV VAR will hold the database name secret (value: thinkstash)

steps:
# Step 1: Install Dependencies
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['install']
  id: 'Install Dependencies'

# Step 2: Lint
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'lint']
  id: 'Lint'
  waitFor: ['Install Dependencies']

# Step 3: Test
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'test']
  id: 'Test'
  waitFor: ['Lint']

# Step 4: Build Prisma Client
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'prisma:generate']
  id: 'Build Prisma Client'
  waitFor: ['Test']

# Step 5: Build Next.js app
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'build']
  id: 'Build Next.js app'
  waitFor: ['Build Prisma Client']

# Step 6: Build Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '.'
  ]
  id: 'Build Docker image'
  waitFor: ['Build Next.js app']

# Step 7: Push Docker image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA']
  id: 'Push Docker image'
  waitFor: ['Build Docker image']

# Step 8.A: Start Cloud SQL Proxy
- name: 'gcr.io/cloud-sql-connectors/cloud-sql-proxy'
  id: 'Start Cloud SQL Proxy'
  waitFor: ['Push Docker image']
  entrypoint: '/cloud-sql-proxy' # Entrypoint of the proxy image
  args:
    # Instance connection name
    - '${_DB_INSTANCE_CONNECTION_NAME}'
    # Address to listen on: 0.0.0.0 makes it accessible from other containers on the network
    - '--address=0.0.0.0'
    - '--port=5432'
    - '--structured-logs'
  # This step will run the proxy in the foreground.
  # The next step needs to start while this is "running".

# Step 8.B: Apply Database Migrations (connects to proxy from Step 8.A)
- name: '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA' # Use your actual app image
  id: 'Apply Database Migrations'
  waitFor: ['Start Cloud SQL Proxy'] # Wait for proxy step to "start"
  secretEnv:
    - 'DB_USER'
    - 'DB_PASSWORD'
    - 'DB_NAME'
  entrypoint: 'sh'
  args:
    - '-c'
    - |
        echo "Waiting 25 seconds for proxy (Step 8.A) to be fully up and listening..."
        sleep 25

        # Attempt to connect to localhost, assuming Cloud Build's network setup allows this
        # if the proxy in Step 8.A binds to 0.0.0.0. This is the most common pattern in examples.
        PROXY_HOST="localhost"

        echo "Attempting migration to proxy at $${PROXY_HOST}:5432..."
        export DATABASE_URL="postgresql://$${DB_USER}:$${DB_PASSWORD}@$${PROXY_HOST}:5432/$${DB_NAME}?schema=public"
        echo "DATABASE_URL set to: [$${DATABASE_URL}]"

        echo "Trying nc $${PROXY_HOST} 5432..."
        nc -v -w 10 $${PROXY_HOST} 5432 < /dev/null && echo "nc check via netcat passed for $${PROXY_HOST}" || echo "nc check via netcat FAILED for $${PROXY_HOST}"

        npx prisma migrate deploy

# Step 9: Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Deploy to Cloud Run'
  waitFor: ['Apply Database Migrations'] # Waits for 8.B
  entrypoint: gcloud
  args: [
    'run',
    'deploy',
    '${_CLOUD_RUN_SERVICE_NAME}',
    '--image=${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '--region=${_GCP_REGION}',
    '--platform=managed',
    '--allow-unauthenticated',
    '--service-account=${_CLOUD_RUN_SA_EMAIL}'
  ]

options:
  logging: CLOUD_LOGGING_ONLY

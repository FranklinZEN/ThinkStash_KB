# Top-level availableSecrets defines how secrets map to ENV VARS for steps
availableSecrets:
  secretManager:
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-user/versions/latest
      env: 'DB_USER_FROM_SECRET' # Using distinct names
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-password/versions/latest
      env: 'DB_PASSWORD_FROM_SECRET'
    - versionName: projects/${_PROJECT_ID}/secrets/kc-db-name/versions/latest
      env: 'DB_NAME_FROM_SECRET'

steps:
# Step 1: Install Dependencies
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['install']
  id: 'Install Dependencies'

# Step 2: Lint
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'lint']
  id: 'Lint'
  waitFor: ['Install Dependencies']

# Step 3: Test
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'test']
  id: 'Test'
  waitFor: ['Lint']

# Step 4: Build Prisma Client
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'prisma:generate']
  id: 'Build Prisma Client'
  waitFor: ['Test']

# Step 5: Build Next.js app
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'build']
  id: 'Build Next.js app'
  waitFor: ['Build Prisma Client']

# Step 6: Build Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '.'
  ]
  id: 'Build Docker image'
  waitFor: ['Build Next.js app']

# Step 7: Push Docker image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA']
  id: 'Push Docker image'
  waitFor: ['Build Docker image']

# Step 8: Apply Database Migrations
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'Apply Database Migrations'
  waitFor: ['Push Docker image']
  entrypoint: 'bash'
  secretEnv:
    - 'DB_USER_FROM_SECRET'
    - 'DB_PASSWORD_FROM_SECRET'
    - 'DB_NAME_FROM_SECRET'
  args:
    - '-c'
    - |
      set -e # Exit on error
      echo "Starting database migration step..."
      # Construct DATABASE_URL using environment variables (escaped with $$ for Cloud Build)
      DB_URL="postgresql://$${DB_USER_FROM_SECRET}:$${DB_PASSWORD_FROM_SECRET}@localhost:5432/$${DB_NAME_FROM_SECRET}?schema=public"
      echo "Constructed DATABASE_URL (password redacted): postgresql://$${DB_USER_FROM_SECRET}:********@localhost:5432/$${DB_NAME_FROM_SECRET}?schema=public"

      echo "Starting Cloud SQL Proxy in background for instance: ${_DB_INSTANCE_CONNECTION_NAME}..." # _DB_INSTANCE_CONNECTION_NAME is a Cloud Build substitution
      cloud_sql_proxy -instances=${_DB_INSTANCE_CONNECTION_NAME}=tcp:5432 &
      PROXY_PID=$$! # Use $$! to correctly get PID in subshell for Cloud Build
      
      echo "Waiting for proxy (PID: $$PROXY_PID) to be ready (10s)..."
      sleep 10 
      
      echo "Proxy started. Running Prisma migrations..."
      # DATABASE_URL needs to be exported for npx prisma to see it
      export DATABASE_URL="$${DB_URL}" # Escaped here too for safety
      
      if ! command -v npx &> /dev/null
      then
        echo "ERROR: Node.js/npx not found in gcr.io/cloud-builders/gcloud."
        echo "Prisma migrations CANNOT run in this step with the current builder."
        exit 1 # Fail the step because migrations can't run
      else
        echo "npx found. Attempting migrations..."
        npx prisma migrate deploy
      fi

      echo "Prisma migrate deploy finished (or failed due to missing npx). Stopping proxy."
      kill $$PROXY_PID || echo "Kill command failed for PID $$PROXY_PID (proxy might have already exited)."
      timeout 5s wait $$PROXY_PID || echo "Proxy already exited or timed out on wait for PID $$PROXY_PID."
      echo "Database migration step completed."

# Step 9: Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk' 
  id: 'Deploy to Cloud Run' 
  waitFor: ['Apply Database Migrations']
  entrypoint: gcloud
  args: [
    'run',
    'deploy',
    '${_CLOUD_RUN_SERVICE_NAME}',
    '--image=${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '--region=${_GCP_REGION}',
    '--platform=managed',
    '--allow-unauthenticated',
    '--service-account=${_CLOUD_RUN_SA_EMAIL}'
  ]

options:
  logging: CLOUD_LOGGING_ONLY
# This is a complete refactor of the cloudbuild.yaml for the new architecture.
# It separates build steps for the webapp and the new AI worker service.

substitutions:
  _GCP_REGION: us-central1
  # Add other substitutions like _PROJECT_ID, _ARTIFACT_REGISTRY_REPO etc. as needed from your setup.
  # Assuming _CLOUD_RUN_SERVICE_NAME, _CLOUD_RUN_SA_EMAIL are set in the trigger.

steps:
# ==============================================================================
# WEBAPP - Build, Test, and Deploy the Next.js Frontend
# ==============================================================================

# 1. Install Webapp Dependencies
- name: 'node:20'
  id: 'webapp-install'
  entrypoint: 'npm'
  args: ['install']

# 2. Build Next.js App (Prisma Generate is now part of this script)
- name: 'node:20'
  id: 'webapp-build'
  waitFor: ['webapp-install']
  entrypoint: 'npm'
  args: ['run', 'build']

# 3. Build Webapp Docker Image
- name: 'gcr.io/cloud-builders/docker'
  id: 'webapp-docker-build'
  waitFor: ['webapp-build']
  args: [
    'build',
    '--no-cache',
    '-t',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-webapp:$COMMIT_SHA',
    '-f', 'webapp.Dockerfile',
    '.'
  ]

# 4. Push Webapp Docker Image
- name: 'gcr.io/cloud-builders/docker'
  id: 'webapp-docker-push'
  waitFor: ['webapp-docker-build']
  args: ['push', '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-webapp:$COMMIT_SHA']

# 5. Run Webapp Migrations with Cloud SQL Proxy
- name: '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-webapp:$COMMIT_SHA'
  id: 'webapp-migrations'
  waitFor: ['webapp-docker-push']
  secretEnv:
    - 'DB_USER'
    - 'DB_PASSWORD'
    - 'DB_NAME'
  entrypoint: 'sh'
  args:
    - '-c'
    - |
      set -e
      echo "Starting migrations with Cloud SQL Proxy..."
      wget https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.10.0/cloud-sql-proxy.linux.amd64 -O /tmp/cloud-sql-proxy
      chmod +x /tmp/cloud-sql-proxy
      # Start proxy in the background. HARDCODED to prevent newline corruption.
      /tmp/cloud-sql-proxy "thinkstash-knowledge-base:us-central1:knowledge-base-ts-db-instance" &
      echo "Waiting for proxy to initialize (10s)..."
      sleep 10
      # The DATABASE_URL for the migration must point to the local proxy.
      # The $$ syntax escapes the variable for Cloud Build's templating,
      # allowing the shell to expand the environment variable at runtime.
      export DATABASE_URL="postgresql://$${DB_USER}:$${DB_PASSWORD}@127.0.0.1:5432/$${DB_NAME}?sslmode=disable"
      echo "DATABASE_URL set for migration. Running migrations..."
      npx prisma migrate deploy
      echo "Migrations complete."
      # Cloud Build automatically terminates child processes (the proxy)

# 6. Deploy Webapp to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'webapp-deploy'
  waitFor: ['webapp-migrations']
  entrypoint: gcloud
  args: [
    'run', 'deploy', '${_CLOUD_RUN_SERVICE_NAME}', # e.g., thinkstash-webapp
    '--image=${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-webapp:$COMMIT_SHA',
    '--region=${_GCP_REGION}',
    '--platform=managed',
    '--allow-unauthenticated',
    '--service-account=${_CLOUD_RUN_SA_EMAIL}',
    # HARDCODED to prevent newline corruption from trigger variables
    '--add-cloudsql-instances=thinkstash-knowledge-base:us-central1:knowledge-base-ts-db-instance',
    '--set-secrets=DATABASE_URL=thinkstash-db-url:latest,NEXTAUTH_SECRET=nextauth-secret:latest,GCS_BUCKET_NAME=thinkstash-gcs-bucket-name:latest'
  ]

# ==============================================================================
# AISERVICE - Build and Deploy the Python AI FastAPI Service
# ==============================================================================

# 7. Build aiservice Docker Image
- name: 'gcr.io/cloud-builders/docker'
  id: 'aiservice-docker-build'
  waitFor: ['webapp-docker-push'] # Can run in parallel with webapp deployment
  args: [
    'build',
    '--no-cache',
    '-t',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-aiservice:$COMMIT_SHA',
    '-f', 'Dockerfile', # Use the new Dockerfile in the root
    '.'
  ]

# 8. Push aiservice Docker Image
- name: 'gcr.io/cloud-builders/docker'
  id: 'aiservice-docker-push'
  waitFor: ['aiservice-docker-build']
  args: ['push', '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-aiservice:$COMMIT_SHA']

# 9. Deploy AI Service to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'aiservice-deploy'
  waitFor: ['aiservice-docker-push']
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud run deploy thinkstash-aiservice \
        --image=${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-aiservice:$COMMIT_SHA \
        --region=${_GCP_REGION} \
        --platform=managed \
        --no-allow-unauthenticated \
        --service-account=${_CLOUD_RUN_SA_EMAIL} \
        --add-cloudsql-instances=thinkstash-knowledge-base:us-central1:knowledge-base-ts-db-instance \
        --cpu=2 \
        --memory=4Gi \
        --min-instances=0 \
        --max-instances=5 \
        --port=8000 \
        --set-secrets=DATABASE_URL=thinkstash-db-url:latest,GEMINI_API_KEY=gemini-api-key:latest,GCS_BUCKET_NAME=thinkstash-gcs-bucket-name:latest,REDIS_URL=redis-url:latest \
        --set-env-vars=^##^
          PYTHONUNBUFFERED=1,##
          PYTHONDONTWRITEBYTECODE=1,##
          USE_GEMINI_VIA_OPENAI_COMPATIBILITY=true,##
          GEMINI_TEXT_MODEL_COMPAT=models/gemini-2.5-flash,##
          GEMINI_COMPATIBILITY_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/,##
          WEB_USE_PLAYWRIGHT_FOR_IMAGE_FILTERING=true,##
          WEB_MIN_IMAGE_WIDTH=300,##
          WEB_MIN_IMAGE_HEIGHT=75,##
          WEB_MIN_IMAGE_AREA=22500,##
          WEB_PLAYWRIGHT_PAGE_LOAD_TIMEOUT_MS=30000,##
          WEB_PLAYWRIGHT_NETWORK_IDLE_TIMEOUT_MS=10000,##
          WEB_MINIMAL_CONTENT_LENGTH_THRESHOLD=500,##
          IMG_FILTER_MIN_WIDTH_PX=75,##
          IMG_FILTER_MIN_HEIGHT_PX=75,##
          IMG_FILTER_MIN_AREA=5000,##
          IMG_FILTER_MAX_ASPECT_RATIO_DEVIATION=999.0,##
          DEFAULT_REQUEST_TIMEOUT_SECONDS=30,##
          MAX_CONCURRENT_TASKS=10

# ==============================================================================
# WORKER - Build and Deploy the Python AI Service Worker
# ==============================================================================

# 10. Build Worker Docker Image
- name: 'gcr.io/cloud-builders/docker'
  id: 'worker-docker-build'
  waitFor: ['webapp-docker-push'] # Can run in parallel
  args: [
    'build',
    '--no-cache',
    '-t',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-worker:$COMMIT_SHA',
    '-f', 'worker.Dockerfile', # Use the new worker.Dockerfile in the root
    '.'
  ]

# 11. Push Worker Docker Image
- name: 'gcr.io/cloud-builders/docker'
  id: 'worker-docker-push'
  waitFor: ['worker-docker-build']
  args: ['push', '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-worker:$COMMIT_SHA']

# 12. Deploy AI Worker as a Cloud Run Service
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'worker-service-deploy'
  waitFor: ['worker-docker-push', 'aiservice-deploy'] # Wait for aiservice to be deployed
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud run deploy thinkstash-worker \
        --image=${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/thinkstash-worker:$COMMIT_SHA \
        --region=${_GCP_REGION} \
        --platform=managed \
        --no-allow-unauthenticated \
        --service-account=${_CLOUD_RUN_SA_EMAIL} \
        --add-cloudsql-instances=thinkstash-knowledge-base:us-central1:knowledge-base-ts-db-instance \
        --cpu=4 \
        --memory=16Gi \
        --min-instances=1 \
        --max-instances=3 \
        --port=8080 \
        --set-secrets=DATABASE_URL=thinkstash-db-url:latest,GEMINI_API_KEY=gemini-api-key:latest,GCS_BUCKET_NAME=thinkstash-gcs-bucket-name:latest,REDIS_URL=redis-url:latest \
        --set-env-vars=^##^
          PYTHONUNBUFFERED=1,##
          PYTHONDONTWRITEBYTECODE=1,##
          USE_GEMINI_VIA_OPENAI_COMPATIBILITY=true,##
          GEMINI_TEXT_MODEL_COMPAT=models/gemini-2.5-flash,##
          GEMINI_COMPATIBILITY_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/,##
          IMG_FILTER_MIN_WIDTH_PX=75,##
          IMG_FILTER_MIN_HEIGHT_PX=75,##
          IMG_FILTER_MIN_AREA=5000,##
          IMG_FILTER_MAX_ASPECT_RATIO_DEVIATION=999.0,##
          DEFAULT_REQUEST_TIMEOUT_SECONDS=30,##
          MAX_CONCURRENT_TASKS=10,##
          # Add a reference to the aiservice for the worker to call back
          AISERVICE_URL=https://thinkstash-aiservice-${_GCP_REGION}-uc.a.run.app

# Define available secrets from Secret Manager
availableSecrets:
  secretManager:
  - versionName: projects/${_PROJECT_ID}/secrets/kc-db-user/versions/latest
    env: 'DB_USER'
  - versionName: projects/${_PROJECT_ID}/secrets/kc-db-password/versions/latest
    env: 'DB_PASSWORD'
  - versionName: projects/${_PROJECT_ID}/secrets/kc-db-name/versions/latest
    env: 'DB_NAME'

options:
  logging: CLOUD_LOGGING_ONLY
steps:
# Step 1: Install Dependencies
- name: 'node:20-slim' # Using official Node.js 20 slim image
  entrypoint: 'npm'
  args: ['install']
  id: 'Install Dependencies'

# Step 2: Lint
- name: 'node:20-slim' # Using official Node.js 20 slim image
  entrypoint: 'npm'
  args: ['run', 'lint']
  id: 'Lint'
  waitFor: ['Install Dependencies'] # Optional but good practice

# Step 3: Test
- name: 'node:20-slim' # Using official Node.js 20 slim image
  entrypoint: 'npm'
  args: ['run', 'test']
  id: 'Test'
  waitFor: ['Lint'] # Run after Linting

options:
  logging: CLOUD_LOGGING_ONLY
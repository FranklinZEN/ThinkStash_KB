availableSecrets:
  secretManager:
  - versionName: projects/${_PROJECT_ID}/secrets/kc-db-user/versions/latest
    env: 'SECRET_DB_USER'
  - versionName: projects/${_PROJECT_ID}/secrets/kc-db-password/versions/latest
    env: 'SECRET_DB_PASSWORD'
  - versionName: projects/${_PROJECT_ID}/secrets/kc-db-name/versions/latest
    env: 'SECRET_DB_NAME'

steps:
# Step 1: Install Dependencies
- name: 'node:20-slim' # Using official Node.js 20 slim image
  entrypoint: 'npm'
  args: ['install']
  id: 'Install Dependencies'

# Step 2: Lint
- name: 'node:20-slim' # Using official Node.js 20 slim image
  entrypoint: 'npm'
  args: ['run', 'lint']
  id: 'Lint'
  waitFor: ['Install Dependencies'] # Optional but good practice

# Step 3: Test
- name: 'node:20-slim' # Using official Node.js 20 slim image
  entrypoint: 'npm'
  args: ['run', 'test']
  id: 'Test'
  waitFor: ['Lint'] # Run after Linting

# Step 4: Build Prisma Client
- name: 'node:20-slim' # Using official Node.js 20 slim image
  entrypoint: 'npm'
  args: ['run', 'prisma:generate'] # Assumes 'prisma:generate': 'prisma generate' in package.json
  id: 'Build Prisma Client'
  waitFor: ['Test'] # Run after Test

# Step 5: Build Next.js app
- name: 'node:20-slim'
  entrypoint: 'npm'
  args: ['run', 'build']
  id: 'Build Next.js app'
  waitFor: ['Build Prisma Client']

# Step 6: Build Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '.'
  ]
  id: 'Build Docker image'
  waitFor: ['Build Next.js app']

# Step 7: Push Docker image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA']
  id: 'Push Docker image'
  waitFor: ['Build Docker image']

# Step 8: Apply Database Migrations
- name: 'gcr.io/google-appengine/exec-wrapper'
  env:
    - 'DB_HOST=localhost' # The proxy listens on localhost
    - 'DB_PORT=5432'      # Default proxy port for PostgreSQL
  args: [
    '-i',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '-s',
    '${_DB_INSTANCE_CONNECTION_NAME}',
    # Construct DATABASE_URL using the secrets made available as env vars by the top-level availableSecrets
    '-e', 'DATABASE_URL=postgresql://$(SECRET_DB_USER):$(SECRET_DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(SECRET_DB_NAME)?schema=public',
    '--',
    'npx', 'prisma', 'migrate', 'deploy'
  ]
  id: 'Apply Database Migrations'
  waitFor: ['Push Docker image']

# Step 9: Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: [
    'run',
    'deploy',
    '${_CLOUD_RUN_SERVICE_NAME}',
    '--image=${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/kc-nextjs-backend:$COMMIT_SHA',
    '--region=${_GCP_REGION}',
    '--platform=managed',
    '--allow-unauthenticated',
    '--service-account=${_CLOUD_RUN_SA_EMAIL}'
    # Add other flags as needed: --vpc-connector, --env-vars-file, etc.
  ]
  id: 'Deploy to Cloud Run'
  waitFor: ['Apply Database Migrations']

options:
  logging: CLOUD_LOGGING_ONLY
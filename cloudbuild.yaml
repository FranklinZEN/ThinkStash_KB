# This file orchestrates a multi-service build, test, and deployment pipeline.
# It builds and tests the Next.js webapp and the Python AI service in parallel,
# runs database migrations, and then deploys both services to Cloud Run.

steps:
# ==============================================================================
# === WEBAPP (NEXT.JS) BUILD & TEST SEQUENCE ===================================
# ==============================================================================
# The Dockerfile handles dependency installation, testing, and building.

# Step 1-WEB: Build webapp Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_WEBAPP_SERVICE_NAME}:$COMMIT_SHA',
    '.',
    '-f', 'Dockerfile'
  ]
  id: 'WebApp-Docker-Build'

# Step 2-WEB: Push webapp Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_WEBAPP_SERVICE_NAME}:$COMMIT_SHA']
  id: 'WebApp-Docker-Push'
  waitFor: ['WebApp-Docker-Build']

# ==============================================================================
# === AISERVICE (PYTHON) BUILD & TEST SEQUENCE =================================
# ==============================================================================
# The Dockerfile handles dependency installation.

# Step 1-AI: Build aiservice Docker image
- name: 'gcr.io/cloud-builders/docker'
  dir: 'aiservice' # Set build context to the aiservice directory
  args: [
    'build',
    '-t',
    '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_AISERVICE_SERVICE_NAME}:$COMMIT_SHA',
    '.',
    '-f', 'Dockerfile'
  ]
  id: 'AIService-Docker-Build'

# Step 2-AI: Push aiservice Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_AISERVICE_SERVICE_NAME}:$COMMIT_SHA']
  id: 'AIService-Docker-Push'
  waitFor: ['AIService-Docker-Build']


# ==============================================================================
# === MIGRATION & DEPLOYMENT SEQUENCE ==========================================
# ==============================================================================

# Step 8: Run DB Migrations (after both images are successfully pushed)
# Uses the webapp image because it has prisma client installed.
- name: '${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_WEBAPP_SERVICE_NAME}:$COMMIT_SHA'
  id: 'Run-Migrations'
  waitFor: ['WebApp-Docker-Push', 'AIService-Docker-Push']
  secretEnv: ['DATABASE_URL']
  entrypoint: 'npx'
  args: ['prisma', 'migrate', 'deploy']

# Step 9-DEPLOY-WEBAPP: Deploy webapp to Cloud Run (runs in parallel with AI service deploy)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'Deploy-WebApp'
  waitFor: ['Run-Migrations']
  entrypoint: gcloud
  args: [
    'run', 'deploy', '${_WEBAPP_SERVICE_NAME}',
    '--image=${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_WEBAPP_SERVICE_NAME}:$COMMIT_SHA',
    '--region=${_GCP_REGION}',
    '--platform=managed',
    '--allow-unauthenticated',
    '--service-account=${_CLOUD_RUN_SA_EMAIL}',
    '--update-secrets=DATABASE_URL=DATABASE_URL:latest,NEXTAUTH_SECRET=nextauth-secret:latest,GCS_MEDIA_BUCKET_NAME=kc-gcs-media-bucket-name:latest,GEMINI_API_KEY=gemini-api-key:latest'
  ]

# Step 10-DEPLOY-AISERVICE: Deploy aiservice to Cloud Run (runs in parallel with webapp deploy)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'Deploy-AIService'
  waitFor: ['Run-Migrations']
  entrypoint: gcloud
  args: [
    'run', 'deploy', '${_AISERVICE_SERVICE_NAME}',
    '--image=${_GCP_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/${_AISERVICE_SERVICE_NAME}:$COMMIT_SHA',
    '--region=${_GCP_REGION}',
    '--platform=managed',
    # Keep the AI service internal
    '--no-allow-unauthenticated',
    '--service-account=${_CLOUD_RUN_SA_EMAIL}',
    '--update-secrets=DATABASE_URL=DATABASE_URL:latest,GCS_BUCKET_NAME=kc-gcs-media-bucket-name:latest,GEMINI_API_KEY=gemini-api-key:latest'
  ]

# Secrets required by the build steps.
# These are mapped to environment variables.
availableSecrets:
  secretManager:
    - versionName: projects/${_PROJECT_ID}/secrets/DATABASE_URL/versions/latest
      env: 'DATABASE_URL'

# Substitution variables that need to be set in the Cloud Build trigger.
# You will need to add _WEBAPP_SERVICE_NAME and _AISERVICE_SERVICE_NAME
# to your trigger configuration.
substitutions:
  _GCP_REGION: 'us-central1'
  _ARTIFACT_REGISTRY_REPO: 'thinkstash-repo'
  _WEBAPP_SERVICE_NAME: 'thinkstash-webapp'
  _AISERVICE_SERVICE_NAME: 'thinkstash-aiservice'
  _DB_INSTANCE_CONNECTION_NAME: 'your-gcp-project:us-central1:your-sql-instance-name'
  _CLOUD_RUN_SA_EMAIL: 'your-service-account@your-gcp-project.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY

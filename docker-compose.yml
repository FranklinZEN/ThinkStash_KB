services:
  postgres:
    image: postgres:15 # Use PostgreSQL version 15
    container_name: knowledge-cards-db # Name the container
    environment:
      POSTGRES_USER: user # Default username from .env
      POSTGRES_PASSWORD: password # Default password from .env
      POSTGRES_DB: knowledge_cards # Default database name from .env
    ports:
      - "5433:5432" # Map host port 5433 to container port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persist data using a named volume
    restart: always # Always restart the container if it stops
    networks:
      - thinkstash-net

  redis:
    image: redis:alpine
    container_name: thinkstash-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - thinkstash-net

  aiservice:
    build:
      context: .
      dockerfile: Dockerfile
    image: thinkstash-aiservice
    container_name: thinkstash-aiservice
    ports:
      - "8000:8000"
    env_file:
      - ./aiservice/.env
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: always
    depends_on:
      - postgres
      - redis
    networks:
      - thinkstash-net

  worker:
    build:
      context: .
      dockerfile: worker.Dockerfile
    image: thinkstash-worker
    command: celery -A celery_app.app worker --loglevel=info
    env_file:
      - ./aiservice/.env
    volumes:
      - ./thinkstash-knowledge-base-94ace76cab03.json:/app/gcs_credentials.json:ro
    container_name: thinkstash-worker
    restart: always
    depends_on:
      - postgres
      - redis
    networks:
      - thinkstash-net

volumes:
  postgres_data: # Define the named volume
  redis_data:

networks:
  thinkstash-net:
    driver: bridge 